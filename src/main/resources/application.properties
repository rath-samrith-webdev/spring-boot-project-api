spring.application.name=rentalApp

# Server
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:spring-api}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rath}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# Swagger UI: remember Authorization token in browser
springdoc.swagger-ui.persistAuthorization=true
